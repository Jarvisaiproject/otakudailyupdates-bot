name: 24/7 Autonomous Anime Blogging Agent Trigger

on:
  schedule:
    # Runs every 1 hour automatically for 15 daily posts
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-render-slot:
    runs-on: ubuntu-latest

    steps:
    - name: Wake Up Render & Trigger Autonomous Slot
      run: |
        echo "Waking up Render Web Service and triggering publishing cycle..."
        curl -X POST https://otakudailyupdates-bot.onrender.com/api/run-slot \
             -H "Content-Type: application/json" \
             -d '{"slot_key":"auto"}'


